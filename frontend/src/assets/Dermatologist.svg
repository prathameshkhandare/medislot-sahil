<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#dce3ff"/>
  <!-- Body -->
  <ellipse cx="50" cy="80" rx="22" ry="13" fill="#6c8ef5"/>
  <!-- Head -->
  <circle cx="50" cy="38" r="15" fill="#f5c5a3"/>
  <!-- Hair (long, female) -->
  <ellipse cx="50" cy="25" rx="15" ry="7" fill="#c0392b"/>
  <rect x="35" y="25" width="5" height="20" rx="3" fill="#c0392b"/>
  <rect x="60" y="25" width="5" height="20" rx="3" fill="#c0392b"/>
  <!-- Eyes -->
  <circle cx="44" cy="37" r="2" fill="#333"/>
  <circle cx="56" cy="37" r="2" fill="#333"/>
  <!-- Smile -->
  <path d="M44 44 Q50 49 56 44" stroke="#c87941" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Skin/face cream jar -->
  <rect x="38" y="60" width="24" height="16" rx="4" fill="white" opacity="0.9"/>
  <rect x="38" y="60" width="24" height="6" rx="3" fill="#a0b4ff"/>
  <!-- Sparkles on skin (dots) -->
  <circle cx="44" cy="32" r="1.2" fill="#ffb347" opacity="0.7"/>
  <circle cx="56" cy="30" r="1" fill="#ffb347" opacity="0.7"/>
  <circle cx="58" cy="36" r="0.8" fill="#ffb347" opacity="0.7"/>
</svg>
