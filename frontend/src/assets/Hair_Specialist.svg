  <ellipse cx="50" cy="24" rx="15" ry="7" fill="#3d2b1f"/>
  <path d="M35 28 Q30 50 34 65" stroke="#3d2b1f" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M65 28 Q70 50 66 65" stroke="#3d2b1f" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="44" cy="37" r="2" fill="#333"/>
  <circle cx="56" cy="37" r="2" fill="#333"/>
  <!-- Smile -->
