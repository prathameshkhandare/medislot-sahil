  <line x1="65" y1="58" x2="78" y2="45" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <circle cx="76" cy="43" r="3" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="79" cy="46" r="3" fill="none" stroke="#555" stroke-width="2"/>
  <!-- Hair strand details on head -->
  <path d="M42 27 Q44 22 48 25" stroke="#5a3e28" stroke-width="1.2" fill="none"/>
  <path d="M52 25 Q56 21 58 26" stroke="#5a3e28" stroke-width="1.2" fill="none"/>
