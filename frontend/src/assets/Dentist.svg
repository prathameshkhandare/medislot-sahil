<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#dce3ff"/>
  <!-- Body with lab coat -->
  <ellipse cx="50" cy="80" rx="22" ry="13" fill="#ffffff"/>
  <ellipse cx="50" cy="80" rx="12" ry="13" fill="#6c8ef5"/>
  <!-- Head -->
  <circle cx="50" cy="38" r="15" fill="#f5c5a3"/>
  <!-- Hair -->
  <ellipse cx="50" cy="25" rx="15" ry="7" fill="#5a3e28"/>
  <!-- Eyes -->
  <circle cx="44" cy="37" r="2" fill="#333"/>
  <circle cx="56" cy="37" r="2" fill="#333"/>
  <!-- Mask (dental) -->
  <rect x="40" y="42" width="20" height="12" rx="5" fill="#a0b4ff" opacity="0.85"/>
  <!-- Dental mirror tool -->
  <line x1="62" y1="52" x2="72" y2="62" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="63" cy="51" r="4" fill="none" stroke="#888" stroke-width="2"/>
  <!-- Tooth icon on chest -->
  <ellipse cx="50" cy="68" rx="7" ry="8" fill="white"/>
  <path d="M43 68 Q44 76 50 76 Q56 76 57 68" fill="#e8eaff"/>
  <line x1="50" y1="60" x2="50" y2="76" stroke="#dce3ff" stroke-width="1"/>
</svg>
